apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: job-service-worker
  name: job-service-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: job-service-worker
  strategy: {}
  template:
    metadata:
      labels:
        app: job-service-worker
    spec:
      containers:
        - image: job-service-worker:1.0
          name: job-service-worker
          envFrom:
            - configMapRef:
                name: job-service-worker-config
            - secretRef:
                name: job-service-worker-secret
          resources: {}
          # Uncomment once job-service-worker-secret has a `key.json` entry
          # (the GCP service account key) to mount it at GCS_KEY_FILE.
          # volumeMounts:
          #   - name: gcs-key
          #     mountPath: /var/secrets/gcs
          #     readOnly: true
      # volumes:
      #   - name: gcs-key
      #     secret:
      #       secretName: job-service-worker-secret
      #       items:
      #         - key: key.json
      #           path: key.json
status: {}
