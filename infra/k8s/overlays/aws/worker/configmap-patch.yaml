apiVersion: v1
kind: ConfigMap
metadata:
  name: job-service-worker-config
data:
  # STORAGE_PROVIDER stays "s3" (inherited from base) — this overlay just
  # points it at real AWS instead of the ministack emulator.
  S3_ENDPOINT: "https://s3.us-east-1.amazonaws.com" # must match AWS_REGION below
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: "<your-aws-access-key-id>"
